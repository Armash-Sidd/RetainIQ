name: RetainIQ CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (OpenMP for XGBoost)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify Evaluation Pipeline Smoke Test
        run: |
          python -m src.evaluate

  docker:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build FastAPI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: retainiq-api:latest

      - name: Build Streamlit Dashboard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          push: false
          tags: retainiq-app:latest

